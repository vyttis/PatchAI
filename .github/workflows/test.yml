name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: patchpilot
          POSTGRES_PASSWORD: test
          POSTGRES_DB: patchpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patchpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://patchpilot:test@localhost:5432/patchpilot_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key
          SUPABASE_JWT_SECRET: test-jwt-secret
        run: |
          cd backend
          pytest -v
