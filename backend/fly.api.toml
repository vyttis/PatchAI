# Fly.io config for patchpilot-api (FastAPI + uvicorn)
# Region: Frankfurt (fra) — EU data residency (Invariant #15)

app = "patchpilot-api"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  min_machines_running = 2

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = 15000
    timeout = 5000
    grace_period = "10s"
    method = "GET"
    path = "/health"

  [services.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
